name: Documentation

on:
  push:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'plugins.md'
      - 'docs/**'
      - 'incubator/summon/README.md'
      - 'incubator/summon/CHANGELOG.md'
      - 'incubator/summon/THIRD_PARTY_NOTICES.md'
      - 'incubator/summon/docs/**'
      - 'incubator/summon/design/**'
      - 'incubator/summon/templates/*/README.md'
      - 'macctl/README.md'
      - 'macctl/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'vercel.json'
      - 'tools/docs-site.py'
      - 'tools/tests/test_docs_site.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'plugins.md'
      - 'docs/**'
      - 'incubator/summon/README.md'
      - 'incubator/summon/CHANGELOG.md'
      - 'incubator/summon/THIRD_PARTY_NOTICES.md'
      - 'incubator/summon/docs/**'
      - 'incubator/summon/design/**'
      - 'incubator/summon/templates/*/README.md'
      - 'macctl/README.md'
      - 'macctl/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'vercel.json'
      - 'tools/docs-site.py'
      - 'tools/tests/test_docs_site.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies only
        run: python -m pip install -r requirements-docs.txt
      - name: Check documentation link behavior
        run: python -m unittest discover -s tools/tests -p test_docs_site.py -v
      - name: Build and validate all public documents
        env:
          DOCS_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: python tools/docs-site.py build --site-dir "$RUNNER_TEMP/summonos-docs-site" --ref "$DOCS_SOURCE_REF"
