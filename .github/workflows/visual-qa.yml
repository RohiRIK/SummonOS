# Visual QA: builds Summon on GitHub's macOS runners and uploads screenshots of the menu bar, the launcher
# (⌃⌥Space, or its CLI/URL fallback) and the menu bar panel in light and dark, plus the template's off-screen
# `--screenshot` render. Fails when a surface does not open or close, a capture is missing, or a capture looks like
# the wrong theme. Artifacts only: nothing is posted or committed, and it is not a merge gate. Review the PNGs from
# the run page or with `gh run download`.
name: Visual QA (macOS)

on:
  workflow_dispatch:
  pull_request:
    # What it captures: the app's windows and panel, and the menubar-panel template's --screenshot render.
    paths:
      - incubator/summon/Sources/SummonMenuUI/**
      - incubator/summon/Sources/SummonMenu/**
      - incubator/summon/Resources/**
      - incubator/summon/design/brand/**
      - incubator/summon/scripts/bundle.sh
      - incubator/summon/scripts/visual-qa/**
      - incubator/summon/templates/menubar-panel/**
      - .github/workflows/visual-qa.yml

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    env:
      OS: ${{ matrix.os }}
    steps:
      # Full-desktop screenshots go into public artifacts: only ever on an ephemeral GitHub-hosted VM.
      - name: Require a GitHub-hosted runner
        if: runner.environment != 'github-hosted'
        run: echo "::error::visual-qa screenshots the whole desktop; run it only on GitHub-hosted runners" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          # The code calls macOS 26 APIs behind #available, so it needs the macOS 26 SDK (Xcode 26) even on macos-15.
          # Read the version into a variable first: piping xcodebuild into `grep -q` breaks its pipe and it aborts.
          version=$(xcodebuild -version)
          if ! grep -q '^Xcode 26' <<<"$version"; then
            xcode=/Applications/Xcode_26.3.app
            echo "Default is $(head -1 <<<"$version"); available: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
            [ -d "$xcode" ] || { echo "::error::$xcode is not on this image"; exit 1; }
            sudo xcode-select -s "$xcode"
          fi
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build Summon.app
        working-directory: incubator/summon
        run: scripts/bundle.sh
      - name: Off-screen render (template --screenshot)
        working-directory: incubator/summon/templates/menubar
        run: |
          swift build --product Starter
          "$(swift build --show-bin-path)/Starter" --screenshot "$RUNNER_TEMP/offscreen"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for theme in light dark; do
            cp "$RUNNER_TEMP/offscreen/panel-$theme.png" "$GITHUB_WORKSPACE/out/$OS-$theme-offscreen-template-panel.png"
          done
      - name: Live captures (hotkey, launcher, menu bar panel)
        run: |
          swiftc -O incubator/summon/scripts/visual-qa/windows.swift -o "$RUNNER_TEMP/windows"
          incubator/summon/scripts/visual-qa/run.sh out "$PWD/incubator/summon/build/Summon.app" "$RUNNER_TEMP/windows" "$OS"
      - name: Upload light
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-${{ matrix.os }}-light
          path: |
            out/*-light-*.png
            out/*-log.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload dark
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-${{ matrix.os }}-dark
          path: |
            out/*-dark-*.png
            out/*-log.txt
          if-no-files-found: error
          retention-days: 14
