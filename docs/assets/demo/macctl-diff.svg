<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 307" width="674" height="307" role="img" aria-label="Terminal: macctl diff">
  <title>Terminal: macctl diff</title>
  <rect width="674" height="307" rx="12" fill="#08060F"/>
  <rect x=".5" y=".5" width="673" height="306" rx="11.5" fill="none" stroke="#2B2347"/>
  <path d="M0 38H674" stroke="#2B2347"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="19" r="6" fill="#28C840"/>
  <text x="337" y="23.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E4DEF7" text-anchor="middle" opacity=".6">macctl diff</text>
  <rect x="590" y="9" width="72" height="20" rx="10" fill="none" stroke="#8C86A6"/>
  <text x="626" y="23" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8C86A6" text-anchor="middle">illustrative</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
    <text x="22" y="70" style="white-space:pre"><tspan fill="#9B7BFF" font-weight="700">$</tspan> <tspan fill="#F6F3FF" font-weight="700">macctl diff profiles/default.json</tspan></text>
    <text x="22" y="91" style="white-space:pre"><tspan fill="#E4DEF7">default: <tspan fill="#FFD479">9</tspan> changes</tspan></text>
    <text x="22" y="112" style="white-space:pre"><tspan fill="#E4DEF7">  appearance.dark-mode         <tspan fill="#FFD479">false</tspan>    <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">true</tspan></tspan></text>
    <text x="22" y="133" style="white-space:pre"><tspan fill="#E4DEF7">  dock.autohide                <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">true</tspan></tspan></text>
    <text x="22" y="154" style="white-space:pre"><tspan fill="#E4DEF7">  dock.show-recents            <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">false</tspan></tspan></text>
    <text x="22" y="175" style="white-space:pre"><tspan fill="#E4DEF7">  dock.tilesize                <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">40</tspan></tspan></text>
    <text x="22" y="196" style="white-space:pre"><tspan fill="#E4DEF7">  finder.show-extensions       <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">true</tspan></tspan></text>
    <text x="22" y="217" style="white-space:pre"><tspan fill="#E4DEF7">  finder.show-pathbar          <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">true</tspan></tspan></text>
    <text x="22" y="238" style="white-space:pre"><tspan fill="#E4DEF7">  keyboard.initial-key-repeat  <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">15</tspan></tspan></text>
    <text x="22" y="259" style="white-space:pre"><tspan fill="#E4DEF7">  keyboard.key-repeat          <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">2</tspan></tspan></text>
    <text x="22" y="280" style="white-space:pre"><tspan fill="#E4DEF7">  screenshots.location         <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  /Users/you/Pictures/Screenshots</tspan></text>
  </g>
</svg>
