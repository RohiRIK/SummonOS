<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 139" width="481" height="139" role="img" aria-label="Terminal: macctl dry-run">
  <title>Terminal: macctl dry-run</title>
  <rect width="481" height="139" rx="12" fill="#08060F"/>
  <rect x=".5" y=".5" width="480" height="138" rx="11.5" fill="none" stroke="#2B2347"/>
  <path d="M0 38H481" stroke="#2B2347"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="19" r="6" fill="#28C840"/>
  <text x="240.5" y="23.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E4DEF7" text-anchor="middle" opacity=".6">macctl dry-run</text>
  <rect x="397" y="9" width="72" height="20" rx="10" fill="none" stroke="#8C86A6"/>
  <text x="433" y="23" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8C86A6" text-anchor="middle">illustrative</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
    <text x="22" y="70" style="white-space:pre"><tspan fill="#9B7BFF" font-weight="700">$</tspan> <tspan fill="#F6F3FF" font-weight="700">macctl set dock.autohide true --dry-run</tspan></text>
    <text x="22" y="91" style="white-space:pre"><tspan fill="#E4DEF7">Dry run: <tspan fill="#FFD479">1</tspan> change would be made (nothing written).</tspan></text>
    <text x="22" y="112" style="white-space:pre"><tspan fill="#E4DEF7">  dock.autohide  <tspan fill="#8C86A6">(unset)</tspan>  <tspan fill="#8C86A6">-&gt;</tspan>  <tspan fill="#FFD479">true</tspan></tspan></text>
  </g>
