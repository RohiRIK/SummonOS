<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 180" width="992" height="180" role="img" aria-label="How a SummonOS app is made: plan, build, verify, publish">
  <title>How a SummonOS app is made: plan, build, verify, publish</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE7FA"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6D4AFF" stop-opacity="0.22"/><stop offset="1" stop-color="#6D4AFF" stop-opacity="0"/></radialGradient></defs>
  <rect width="992" height="180" rx="20" fill="url(#bg)"/>
  <defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D4AFF"/><stop offset="1" stop-color="#0098C7"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6D4AFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="24" y="24" width="200" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#DDD3FF" stroke-width="1.5"/>
  <circle cx="58" cy="60" r="16" fill="none" stroke="url(#gs)" stroke-width="3"/>
  <text x="58" y="65.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15111F" text-anchor="middle">1</text>
  <text x="84" y="67" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#15111F">Plan</text>
  <text x="44" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">A new app idea, or a</text>
  <text x="44" y="128" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">Linux widget to port</text>
  <path d="M232 90H264" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="272" y="24" width="200" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#DDD3FF" stroke-width="1.5"/>
  <circle cx="306" cy="60" r="16" fill="none" stroke="url(#gs)" stroke-width="3"/>
  <text x="306" y="65.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15111F" text-anchor="middle">2</text>
  <text x="332" y="67" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#15111F">Build</text>
  <text x="292" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">SwiftPM and SwiftUI,</text>
  <text x="292" y="128" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">Core logic test-first</text>
  <path d="M480 90H512" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="520" y="24" width="200" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#DDD3FF" stroke-width="1.5"/>
  <circle cx="554" cy="60" r="16" fill="none" stroke="url(#gs)" stroke-width="3"/>
  <text x="554" y="65.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15111F" text-anchor="middle">3</text>
  <text x="580" y="67" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#15111F">Verify</text>
  <text x="540" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">Gate, previews, run</text>
  <text x="540" y="128" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">the app, read the logs</text>
  <path d="M728 90H760" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="768" y="24" width="200" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#DDD3FF" stroke-width="1.5"/>
  <circle cx="802" cy="60" r="16" fill="none" stroke="url(#gs)" stroke-width="3"/>
  <text x="802" y="65.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15111F" text-anchor="middle">4</text>
  <text x="828" y="67" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#15111F">Publish</text>
  <text x="788" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">Dev repo PR, then a</text>
  <text x="788" y="128" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2440" opacity=".8">clean public snapshot</text>
</svg>
