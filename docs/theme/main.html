{% extends "base.html" %}

{% block header %}
  {% if page.is_homepage %}
    <a class="md-skip" href="#home-title">Skip to content</a>
  {% endif %}
  {{ super() }}
{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if config.extra.vercel_analytics %}
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  {% endif %}
{% endblock %}
