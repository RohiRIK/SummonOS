# Canonical sources stay in the repository. tools/docs-site.py supplies a temporary
# docs_dir, complete discovered navigation, and source-correct edit links.
site_name: SummonOS Docs
site_description: Guides, command references, architecture, and historical research for SummonOS.
site_url: https://sumonos.rohi-lab.org/
repo_url: https://github.com/RohiRIK/SummonOS
repo_name: RohiRIK/SummonOS
edit_uri: edit/main/
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  custom_dir: docs/theme
  logo: incubator/summon/design/brand/mark-on-dark.svg
  favicon: incubator/summon/design/brand/app-icon-128.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - toc.follow
    - navigation.footer

extra_css:
  - docs/assets/wiki.css

copyright: SummonOS · Native Mac tools, documented in the open.

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
