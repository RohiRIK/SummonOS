# Reference snippet. The workspace job is active in .github/workflows/swift.yml on pushes and PRs.
# Make gate changes in that workflow; this is a minimal example for other workspace repositories.

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Workspace hygiene (package roots, file sizes, plugins.md)
        run: tools/check-workspace.sh
